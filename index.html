<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram KML Viewer</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        :root {
            --ig-bg: #fafafa;
            --ig-border: #dbdbdb;
            --ig-blue: #0095f6;
        }

        body {
            background-color: var(--ig-bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 50px;
        }

        .navbar {
            background: white;
            width: 100%;
            height: 60px;
            border-bottom: 1px solid var(--ig-border);
            display: flex;
            justify-content: center;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            margin-bottom: 20px;
        }

        .navbar b { font-size: 20px; letter-spacing: -1px; }

        /* Instagram Post Tasarımı */
        .post {
            background: white;
            width: 100%;
            max-width: 470px;
            border: 1px solid var(--ig-border);
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .post-header {
            padding: 12px;
            display: flex;
            align-items: center;
        }

        .profile-circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
            padding: 2px;
            margin-right: 10px;
        }

        .profile-inner {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            font-weight: bold;
        }

        /* Harita Alanı (Kare 1:1) */
        .map-wrapper {
            width: 100%;
            padding-top: 100%;
            position: relative;
            background: #efefef;
        }

        .map-instance {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .post-actions {
            padding: 12px;
            display: flex;
            gap: 16px;
        }

        .post-actions i { font-size: 24px; cursor: pointer; }
        .post-actions i:hover { color: #8e8e8e; }

        .caption {
            padding: 0 12px 12px 12px;
            font-size: 14px;
            line-height: 1.5;
        }

        .username { font-weight: 600; margin-right: 5px; }

        #loading-status {
            margin-top: 20px;
            color: #8e8e8e;
            font-size: 14px;
        }

        /* Hata Mesajı */
        .error-box { padding: 40px; text-align: center; color: #ed4956; }
    </style>
</head>
<body>

    <div class="navbar">
        <b>Instagram <span style="font-weight: 300;">KML</span></b>
    </div>

    <div id="loading-status">Dosyalar GitHub'dan taranıyor...</div>
    <div id="feed"></div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-plugins/3.4.0/layer/vector/KML.js"></script>

    <script>
        // --- BURAYI KENDİ BİLGİLERİNLE DOLDUR ---
        const GITHUB_USER = "KULLANICI_ADIN"; // Örn: hakan_yildiz
        const GITHUB_REPO = "REPO_ADIN";      // Örn: harita-sunumlarim
        // ---------------------------------------

        async function initFeed() {
            const feed = document.getElementById('feed');
            const status = document.getElementById('loading-status');

            try {
                // 1. GitHub API ile dosyaları al
                const response = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/`);
                if (!response.ok) throw new Error("Dosyalar alınamadı. Ayarları kontrol edin.");
                
                const files = await response.json();
                const kmlFiles = files.filter(f => f.name.toLowerCase().endsWith('.kml'));

                if (kmlFiles.length === 0) {
                    status.innerHTML = "Hiç .kml dosyası bulunamadı. Lütfen repo'ya yükleyin.";
                    return;
                }

                status.style.display = 'none';

                // 2. Her KML dosyası için bir post oluştur
                for (const file of kmlFiles) {
                    createPost(file);
                }

            } catch (err) {
                status.innerHTML = `<div class="error-box">Hata: ${err.message}</div>`;
            }
        }

        function createPost(file) {
            const feed = document.getElementById('feed');
            
            // Post HTML yapısı
            const post = document.createElement('div');
            post.className = 'post';
            const mapId = 'map-' + Math.random().toString(36).substr(2, 9);

            post.innerHTML = `
                <div class="post-header">
                    <div class="profile-circle"><div class="profile-inner">KML</div></div>
                    <div class="username">${file.name}</div>
                </div>
                <div class="map-wrapper">
                    <div id="${mapId}" class="map-instance"></div>
                </div>
                <div class="post-actions">
                    <i class="far fa-heart" onclick="this.classList.toggle('fas'); this.classList.toggle('far'); this.style.color=this.classList.contains('fas')?'#ed4956':''"></i>
                    <i class="far fa-comment"></i>
                    <i class="far fa-paper-plane"></i>
                    <i class="far fa-bookmark" style="margin-left:auto"></i>
                </div>
                <div class="caption">
                    <span class="username">${GITHUB_USER}</span>
                    Bu rota otomatik olarak <b>${file.name}</b> dosyasından oluşturulmuştur.
                </div>
            `;

            feed.appendChild(post);

            // Haritayı yükle
            renderMap(mapId, file.download_url);
        }

        function renderMap(elementId, kmlUrl) {
            const map = L.map(elementId, {
                zoomControl: true,
                attributionControl: false,
                scrollWheelZoom: false // Sayfa kayarken haritanın zoom yapmasını engeller
            }).setView([39, 35], 5);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

            fetch(kmlUrl)
                .then(res => res.text())
                .then(kmltext => {
                    const parser = new DOMParser();
                    const kml = parser.parseFromString(kmltext, 'text/xml');
                    const track = new L.KML(kml);
                    map.addLayer(track);
                    
                    const bounds = track.getBounds();
                    if (bounds.isValid()) {
                        map.fitBounds(bounds);
                    }
                })
                .catch(e => console.error("Harita yüklenemedi:", e));
        }

        // Başlat
        initFeed();
    </script>
</body>
</html>
