<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insta-Imar</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="nav-content">
            <div class="logo">İmarGram</div>
            <div class="search-box">
                <input type="text" placeholder="Ada/Parsel Ara...">
            </div>
            <div class="nav-icons">
                <span>🏠</span>
                <span>🗺️</span>
                <span>❤️</span>
                <img src="https://upload.wikimedia.org/wikipedia/tr/e/e3/İstanbul_Büyükşehir_Belediyesi_logosu.png" class="nav-profile">
            </div>
        </div>
    </nav>

    <main class="main-container">
        <section class="feed" id="feed-container">
            </section>

        <aside class="sidebar">
            <div class="sidebar-profile">
                <img src="https://upload.wikimedia.org/wikipedia/tr/e/e3/İstanbul_Büyükşehir_Belediyesi_logosu.png" alt="Profile">
                <div>
                    <p class="username">imar_istanbul</p>
                    <p class="sub-text">İstanbul Büyükşehir Belediyesi</p>
                </div>
                <a href="https://imar.istanbul" target="_blank" class="switch-link">Siteye Git</a>
            </div>
            <div class="suggestions">
                <p class="sug-header">Sizin için Önerilenler</p>
                <div class="sug-item">
                    <div class="sug-user">
                        <div class="grey-pic"></div>
                        <p>tapu_kadastro</p>
                    </div>
                    <button>Takip Et</button>
                </div>
            </div>
        </aside>
    </main>

    <script src="app.js"></script>
</body>
</html>
