<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>İstanbul Emlak Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body { font-family: Arial; margin: 0; padding: 20px;}
    .chart { width: 100%; height: 400px; margin-bottom: 40px;}
  </style>
</head>
<body>
  <h1>İstanbul Emlak Dashboard</h1>
  <canvas id="ilanTrend" class="chart"></canvas>
  <canvas id="fiyatTrend" class="chart"></canvas>
  <canvas id="semtFiyat" class="chart"></canvas>

  <script>
    const API_BASE = "https://your-backend-api.com";

    async function fetchData(endpoint) {
      const res = await fetch(API_BASE + endpoint);
      return res.json();
    }

    async function initDashboard() {
      // Aylık İlan Trend
      const ilanData = await fetchData("/ilanlar/trend?group=ay");
      new Chart(document.getElementById("ilanTrend"), {
        type: 'bar',
        data: {
          labels: ilanData.labels,
          datasets: [{
            label: "Aylık İlan Sayısı",
            data: ilanData.values,
            backgroundColor: "rgba(54, 162, 235, 0.6)"
          }]
        }
      });

      // Fiyat Trend
      const fiyatData = await fetchData("/fiyat/trend?group=ay");
      new Chart(document.getElementById("fiyatTrend"), {
        type: 'line',
        data: {
          labels: fiyatData.labels,
          datasets: [{
            label: "Ortalama Fiyat",
            data: fiyatData.values,
            borderColor: "rgba(255, 99, 132, 1)",
            fill: false
          }]
        }
      });

      // Semt Bazlı Fiyat
      const semtData = await fetchData("/fiyat/semt");
      new Chart(document.getElementById("semtFiyat"), {
        type: 'bar',
        data: {
          labels: semtData.labels,
          datasets: [{
            label: "Semt Ortalama Fiyat",
            data: semtData.values,
            backgroundColor: "rgba(75, 192, 192, 0.6)"
          }]
        }
      });

    }

    initDashboard();
  </script>
</body>
</html>
