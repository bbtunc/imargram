<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sunum Akışım</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background-color: #fafafa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .phone-container {
            background: white;
            width: 100%;
            max-width: 470px; /* Instagram web genişliği */
            border: 1px solid #dbdbdb;
            border-radius: 3px;
            margin: 20px 0;
        }

        /* Üst Başlık */
        .header {
            padding: 14px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #efefef;
        }

        .profile-pic {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #ddd;
            margin-right: 10px;
            background-image: url('https://via.placeholder.com/150'); /* Profil foton */
            background-size: cover;
        }

        .username {
            font-weight: 600;
            font-size: 14px;
            color: #262626;
        }

        /* Slayt Alanı (Carousel) */
        .carousel-container {
            position: relative;
            width: 100%;
            padding-top: 100%; /* 1:1 Kare oran */
            overflow: hidden;
            background-color: #000;
        }

        .slides {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            transition: transform 0.3s ease-in-out;
        }

        .slide {
            min-width: 100%;
            height: 100%;
            object-fit: contain; /* Resmi sığdır */
        }

        /* Oklar */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.7);
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
        }
        .prev { left: 10px; display: none; } /* İlk başta gizli */
        .next { right: 10px; }

        /* Alt Aksiyonlar */
        .actions {
            padding: 10px 16px;
        }
        .actions i {
            font-size: 24px;
            margin-right: 15px;
            cursor: pointer;
            color: #262626;
        }
        .actions i:hover { color: #8e8e8e; }

        .likes {
            padding: 0 16px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .caption {
            padding: 0 16px 16px 16px;
            font-size: 14px;
        }
        .caption .user-bold { font-weight: 600; margin-right: 5px; }
        
        /* Noktalar (Pagination) */
        .dots-container {
            position: absolute;
            bottom: 15px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 5px;
        }
        .dot {
            width: 6px;
            height: 6px;
            background-color: rgba(255,255,255,0.4);
            border-radius: 50%;
        }
        .dot.active { background-color: white; }

    </style>
</head>
<body>

    <div class="phone-container">
        <div class="header">
            <div class="profile-pic"></div> <div class="username">sunum_uzmani</div>
            <i class="fas fa-ellipsis-h" style="margin-left: auto;"></i>
        </div>

        <div class="carousel-container">
            <div class="slides" id="slideContainer">
                <img src="https://via.placeholder.com/600x600/3498db/ffffff?text=Sunum+Kapağı" class="slide">
                <img src="https://via.placeholder.com/600x600/e74c3c/ffffff?text=Slayt+1" class="slide">
                <img src="https://via.placeholder.com/600x600/2ecc71/ffffff?text=Slayt+2" class="slide">
                <img src="https://via.placeholder.com/600x600/f1c40f/ffffff?text=Teşekkürler" class="slide">
            </div>

            <button class="nav-btn prev" onclick="moveSlide(-1)"><i class="fas fa-chevron-left"></i></button>
            <button class="nav-btn next" onclick="moveSlide(1)"><i class="fas fa-chevron-right"></i></button>
            
            <div class="dots-container" id="dots"></div>
        </div>

        <div class="actions">
            <i class="far fa-heart"></i>
            <i class="far fa-comment"></i>
            <i class="far fa-paper-plane"></i>
            <i class="far fa-bookmark" style="margin-left: auto; margin-right: 0;"></i>
        </div>

        <div class="likes">1.245 beğenme</div>

        <div class="caption">
            <span class="user-bold">sunum_uzmani</span>
            Bu hafta hazırladığım proje sunumunun detayları. Kaydırarak inceleyebilirsiniz! 🚀 #sunum #proje #tasarım
        </div>
    </div>

    <script>
        let currentSlide = 0;
        const slidesContainer = document.getElementById('slideContainer');
        const slides = document.querySelectorAll('.slide');
        const dotsContainer = document.getElementById('dots');
        const prevBtn = document.querySelector('.prev');
        const nextBtn = document.querySelector('.next');

        // Noktaları oluştur
        slides.forEach((_, idx) => {
            const dot = document.createElement('div');
            dot.classList.add('dot');
            if(idx === 0) dot.classList.add('active');
            dotsContainer.appendChild(dot);
        });

        const dots = document.querySelectorAll('.dot');

        function moveSlide(direction) {
            currentSlide += direction;

            // Sınırları kontrol et
            if (currentSlide < 0) currentSlide = 0;
            if (currentSlide >= slides.length) currentSlide = slides.length - 1;

            updateUI();
        }

        function updateUI() {
            // Kaydırma işlemi
            slidesContainer.style.transform = `translateX(-${currentSlide * 100}%)`;

            // Buton görünürlüğü
            prevBtn.style.display = currentSlide === 0 ? 'none' : 'flex';
            nextBtn.style.display = currentSlide === slides.length - 1 ? 'none' : 'flex';

            // Noktaları güncelle
            dots.forEach((dot, idx) => {
                dot.classList.toggle('active', idx === currentSlide);
            });
        }
    </script>
</body>
</html>
