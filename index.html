<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İmar İstanbul - Sosyal Arayüz</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <nav class="navbar">
        <div class="nav-content">
            <div class="logo-area">
                <img src="img/logo.png" alt="İmar Logo" class="nav-brand-logo">
                <span class="logo-text">imar.istanbul</span>
            </div>
            
            <div class="search-box">
                <input type="text" placeholder="Ada / Parsel Ara">
            </div>
            
            <div class="nav-icons">
                <span>🏠</span> <span>📍</span> <img src="img/logo.png" class="nav-profile">
            </div>
        </div>
    </nav>

    <main class="main-container">
        <section class="feed" id="feed-container">
            </section>

        <aside class="sidebar">
            <div class="sidebar-profile">
                <img src="img/logo.png" alt="Profile">
                <div>
                    <p class="username">imar.istanbul</p>
                    <p class="sub-text">İstanbul Büyükşehir Belediyesi</p>
                </div>
                <a href="https://imar.istanbul" target="_blank" class="switch-link">SİTEYE GİT</a>
            </div>
            
            <div class="suggestions">
                <p class="sug-header">Hızlı Erişim</p>
                <div class="sug-item">
                    <div class="sug-text">
                        <p class="sug-title">Plan Askı</p>
                        <p class="sug-desc">Askıdaki planlar</p>
                    </div>
                </div>
                <div class="sug-item">
                    <div class="sug-text">
                        <p class="sug-title">Uygulama</p>
                        <p class="sug-desc">Mobil İmar</p>
                    </div>
                </div>
            </div>
        </aside>
    </main>

    <script src="app.js"></script>
</body>
</html>
